<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosotros">
<meta name="theme-color" content="#140C1C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>Nosotros</title>
</head>
<body class="loading" data-accent="aurora">
<script>try { const a = localStorage.getItem('nosotros-accent'); if (a) document.body.dataset.accent = a; } catch {}</script>
<div id="bgfx"></div>

<!-- Íconos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6.3 5 5 0 0 1 21.2 11C19 15.6 12 20 12 20Z"/></symbol>
  <symbol id="i-heart-f" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6.3 5 5 0 0 1 21.2 11C19 15.6 12 20 12 20Z"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><g fill="currentColor"><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="15" cy="9" r="1.4"/><circle cx="9" cy="15" r="1.4"/></g></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6 10 3.5h4L15.5 6"/></g></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1.5"/><path d="M5 13v7h14v-7M12 8v12M12 8S10.5 3.5 8 4.5 9 8 12 8Zm0 0s1.5-4.5 4-3.5S15 8 12 8Z"/></g></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m6 12.5 4 4 8-9"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5h16v11H9l-5 4V5Z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 8H6.8"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></g></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6 15 3l1 3"/></g></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M21 15.5v-2l-8-5V4.2a1.5 1.5 0 0 0-3 0v4.3l-8 5v2l8-2.5v4.5L8 19v1.8l4-1 4 1V19l-2-1.5V13Z" transform="translate(.5 0)"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1.5-3 4-3 7v3h3"/></g></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></g></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Zm7 12c.3 2.2 1 3 3 3.3-2 .3-2.7 1-3 3.2-.3-2.2-1-2.9-3-3.2 2-.3 2.7-1.1 3-3.3Z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></g></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.2v.3"/></g></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18M3 15h18M8 5v4M16 5v4M8 15v4M16 15v4"/></g></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 21c-3.9 0-7-2.8-7-6.6 0-3.6 2.6-5.6 4-8.4.5 1.9 1.5 3 2.6 3.6C11.8 6.4 13 4.4 15 3c-.3 3 1 5 2.4 6.8 1 1.3 1.6 2.6 1.6 4.4 0 4-3.1 6.8-7 6.8Z"/></symbol>
</defs></svg>

<!-- Acceso -->
<div class="gate" id="loadingGate"><span class="beat" style="font-size:52px">❤️</span></div>
<div class="gate" id="configGate"><div class="glass center" style="max-width:360px"><h2>Falta conectar Firebase</h2><p class="muted">Pega los datos del proyecto en firebase-config.js.</p></div></div>
<div class="gate" id="loginGate">
  <form class="glass stack" style="max-width:380px;width:100%;padding:26px" onsubmit="event.preventDefault();login()">
    <div class="center" style="font-size:50px">💞</div>
    <h1 class="center grad-text" style="font-size:34px">Nosotros</h1>
    <div><label class="f" for="loginEmail">Correo</label><input type="email" id="loginEmail" autocomplete="username" autocapitalize="off" required></div>
    <div><label class="f" for="loginPass">Contraseña</label><input type="password" id="loginPass" autocomplete="current-password" required></div>
    <button class="btn" id="loginBtn" type="submit" style="margin-top:8px">Entrar</button>
    <button class="link" type="button" onclick="resetPass()">¿Olvidaste tu contraseña?</button>
  </form>
</div>

<main>
  <div class="offline">Sin conexión · los cambios se sincronizan al volver</div>
  <section class="screen active" id="s-home" data-tab="home"></section>
  <section class="screen" id="s-decide" data-tab="decide"></section>
  <section class="screen" id="s-moments" data-tab="moments"></section>
  <section class="screen" id="s-love" data-tab="love"></section>
  <section class="screen" id="s-more" data-tab="more"></section>
  <section class="screen" id="s-bucket" data-tab="more"></section>
  <section class="screen" id="s-grocery" data-tab="more"></section>
  <section class="screen" id="s-money" data-tab="more"></section>
  <section class="screen" id="s-places" data-tab="more"></section>
  <section class="screen" id="s-trips" data-tab="more"></section>
  <section class="screen" id="s-trip" data-tab="more"></section>
  <section class="screen" id="s-us" data-tab="more"></section>
  <section class="screen" id="s-quiz" data-tab="more"></section>
  <section class="screen" id="s-summary" data-tab="more"></section>
  <section class="screen" id="s-shows" data-tab="more"></section>
  <section class="screen" id="s-cal" data-tab="more"></section>
  <section class="screen" id="s-game" data-tab="more"></section>
  <section class="screen" id="s-settings" data-tab="more"></section>
</main>

<nav class="tabbar" aria-label="Secciones">
  <button data-tab="home" class="on" onclick="go('s-home')" aria-label="Inicio"><svg><use href="#i-heart"/></svg><b class="dot" id="dot-home" hidden></b></button>
  <button data-tab="decide" onclick="go('s-decide')" aria-label="Decidir"><svg><use href="#i-dice"/></svg><b class="dot" id="dot-decide" hidden></b></button>
  <button data-tab="moments" onclick="go('s-moments')" aria-label="Momentos"><svg><use href="#i-photo"/></svg></button>
  <button data-tab="love" onclick="go('s-love')" aria-label="Detalles"><svg><use href="#i-gift"/></svg><b class="dot" id="dot-love" hidden></b></button>
  <button data-tab="more" onclick="go('s-more')" aria-label="Más"><svg><use href="#i-grid"/></svg><b class="dot" id="dot-more" hidden></b></button>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><div class="grabber"></div><div id="sheetBody"></div></div></div>
<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewerImg" alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
